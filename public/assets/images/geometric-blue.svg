<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0056b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d82;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#blueGradient)"/>
  
  <!-- Geometric shapes -->
  <circle cx="100" cy="100" r="120" fill="#0099ff" opacity="0.1"/>
  <circle cx="1100" cy="700" r="180" fill="#66b3ff" opacity="0.08"/>
  <circle cx="600" cy="400" r="200" fill="#0066cc" opacity="0.05"/>
  
  <!-- Polygons -->
  <polygon points="0,0 200,0 100,173" fill="#66b3ff" opacity="0.12"/>
  <polygon points="1200,800 1000,800 1100,627" fill="#0099ff" opacity="0.1"/>
  
  <!-- Lines and accent elements -->
  <line x1="0" y1="0" x2="300" y2="300" stroke="#66b3ff" stroke-width="3" opacity="0.15"/>
  <line x1="1200" y1="0" x2="900" y2="300" stroke="#0099ff" stroke-width="3" opacity="0.15"/>
  
  <!-- Additional geometric accents -->
  <rect x="50" y="600" width="150" height="150" fill="#0099ff" opacity="0.08" transform="rotate(45 125 675)"/>
  <rect x="1000" y="100" width="120" height="120" fill="#66b3ff" opacity="0.08" transform="rotate(-30 1060 160)"/>
  
  <!-- Subtle dots pattern -->
  <circle cx="200" cy="200" r="4" fill="#66b3ff" opacity="0.2"/>
  <circle cx="300" cy="250" r="4" fill="#0099ff" opacity="0.2"/>
  <circle cx="400" cy="180" r="4" fill="#66b3ff" opacity="0.2"/>
  <circle cx="900" cy="600" r="4" fill="#0099ff" opacity="0.2"/>
  <circle cx="1000" cy="650" r="4" fill="#66b3ff" opacity="0.2"/>
  <circle cx="1100" cy="550" r="4" fill="#0099ff" opacity="0.2"/>
</svg>
